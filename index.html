<title>JQuants Drive Backup</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:48px auto;padding:0 24px;line-height:1.9;color:#243043}h1,h2{line-height:1.4}a{color:#175bb1}</style></head><body><h1>JQuants Drive Backup</h1><p>J-Quantsで取得した株価データや分析用ファイルを、利用者自身のGoogle Driveにバックアップする個人用ツールです。</p><h2>Google Driveとの連携</h2><p>利用者がGoogleアカウントでアクセスを許可した後、バックアップ処理に必要な範囲でGoogle Drive APIを利用し、保存先フォルダやバックアップファイルを管理します。</p><p>一般向けの利用者募集は行っていません。</p><p>お問い合わせ先はGoogleの認証同意画面に表示されるユーザーサポートメールアドレスです。</p><p><a href="privacy.html">プライバシーポリシー</a></p></body></html>
